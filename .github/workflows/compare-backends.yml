name: Backend comparison benchmark

# Single-arch comparison of the standard docker-daemon build vs the native buildkit
# backend, on identical footing (same pack binary, builder, run image; host
# platform; native — no emulation). We measure the BUILD, not the publish: the
# docker-daemon backend builds to the local daemon; the buildkit backend publishes
# to Docker Hub (it cannot load a manifest to the daemon).
#
# Structure:
#   * `compare` job — a MATRIX over apps, so each app runs on its OWN parallel
#     runner (a clean runner = a genuinely cold environment). Within each job the
#     four builds (daemon cold, daemon rebuild, buildkit cold, buildkit rebuild)
#     are SEPARATE, individually-timed steps so their durations show directly in
#     the GitHub Actions UI (no log scraping). Each job writes a one-row artifact.
#   * `aggregate` job — collects the per-app rows and prints the combined
#     comparison table as RAW MARKDOWN (to the log and the run summary) so it can be
#     copied straight into a README/RFC.
#
# The `pack` binary source is parameterized: build from source at pack_ref
# (default), or pull it out of pack_image when set.

on:
  workflow_dispatch:
    inputs:
      pack_image:
        description: >-
          Optional: pull `pack` from this image and copy the binary out instead of
          building from source (e.g. jericop/pack:buildkit-native-export-v0.1.0).
        required: false
        default: ""
      pack_ref:
        description: "pack fork git ref to build from when pack_image is empty"
        required: false
        default: "buildkit-native-export"
      builder:
        description: "Builder image used for BOTH backends"
        required: false
        default: "jericop/ubuntu-noble-builder:buildkit-native-export"
      run_image:
        description: "Run image"
        required: false
        default: "paketobuildpacks/ubuntu-noble-run:latest"
      samples_repo:
        description: "Samples repo to checkout (org/name)"
        required: false
        default: "buildpacks/samples"

env:
  PACK_IMAGE: ${{ github.event.inputs.pack_image || '' }}
  PACK_REF: ${{ github.event.inputs.pack_ref || 'buildkit-native-export' }}
  BUILDER: ${{ github.event.inputs.builder || 'jericop/ubuntu-noble-builder:buildkit-native-export' }}
  RUN_IMAGE: ${{ github.event.inputs.run_image || 'paketobuildpacks/ubuntu-noble-run:latest' }}
  SAMPLES_REPO: ${{ github.event.inputs.samples_repo || 'buildpacks/samples' }}
  # CI runners are linux/amd64.
  PLATFORM: linux/amd64

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: go/mod
            id: go-mod
          - app: nodejs/npm
            id: nodejs-npm
          - app: java/maven
            id: java-maven
          - app: java/java-node
            id: java-java-node
          - app: python/poetry
            id: python-poetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pack (harness)
        uses: actions/checkout@v5
        with:
          path: pack-repo

      - name: Checkout samples
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SAMPLES_REPO }}
          path: samples

      - name: Checkout pack source
        if: ${{ env.PACK_IMAGE == '' }}
        uses: actions/checkout@v5
        with:
          repository: jericop/pack
          ref: ${{ env.PACK_REF }}
          path: pack-src

      - name: Set up Go
        if: ${{ env.PACK_IMAGE == '' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: pack-src/go.mod

      - name: Build pack from source
        if: ${{ env.PACK_IMAGE == '' }}
        run: |
          cd pack-src
          go build -o "${GITHUB_WORKSPACE}/pack-bin" .

      - name: Copy pack binary out of published image
        if: ${{ env.PACK_IMAGE != '' }}
        run: |
          docker pull "${PACK_IMAGE}"
          cid="$(docker create "${PACK_IMAGE}")"
          docker cp "${cid}:/usr/local/bin/pack" "${GITHUB_WORKSPACE}/pack-bin"
          docker rm "${cid}" >/dev/null

      - name: pack version + experimental
        run: |
          chmod +x "${GITHUB_WORKSPACE}/pack-bin"
          "${GITHUB_WORKSPACE}/pack-bin" version
          "${GITHUB_WORKSPACE}/pack-bin" config experimental true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create buildx builder
        run: docker buildx create --name pack-multiplatform --driver docker-container --bootstrap --use

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Warm up the builder + run images into BOTH caches so image pull time is
      # excluded from every timed build below (fair start for both backends).
      - name: Warm up builder + run images (excluded from timings)
        run: |
          docker pull --platform "$PLATFORM" "$BUILDER"
          docker pull --platform "$PLATFORM" "$RUN_IMAGE"
          seed="$(mktemp -d)"
          printf 'FROM %s AS b\nFROM %s AS r\n' "$BUILDER" "$RUN_IMAGE" > "$seed/Dockerfile"
          docker buildx build --builder pack-multiplatform --platform "$PLATFORM" --output=type=cacheonly "$seed"
          rm -rf "$seed"

      # --- four separately-timed builds; each records its own duration (seconds) ---
      # A clean matrix runner means the cold builds are genuinely cold. The daemon
      # backend builds to the local daemon (measure the build, not a push); the
      # buildkit backend publishes to Docker Hub under a unique per-run tag.

      - name: "daemon: cold"
        id: daemon_cold
        env:
          IMG: cmp-daemon-${{ matrix.id }}-${{ github.run_id }}:latest
        run: |
          s=$(date +%s.%N)
          "${GITHUB_WORKSPACE}/pack-bin" build "$IMG" \
            --path "${GITHUB_WORKSPACE}/samples/${{ matrix.app }}" \
            --builder "$BUILDER" --run-image "$RUN_IMAGE" \
            --platform "$PLATFORM" --trust-builder
          e=$(date +%s.%N)
          echo "seconds=$(awk -v s=$s -v e=$e 'BEGIN{printf "%.2f", e-s}')" >> "$GITHUB_OUTPUT"

      - name: "daemon: rebuild"
        id: daemon_rebuild
        env:
          IMG: cmp-daemon-${{ matrix.id }}-${{ github.run_id }}:latest
        run: |
          s=$(date +%s.%N)
          "${GITHUB_WORKSPACE}/pack-bin" build "$IMG" \
            --path "${GITHUB_WORKSPACE}/samples/${{ matrix.app }}" \
            --builder "$BUILDER" --run-image "$RUN_IMAGE" \
            --platform "$PLATFORM" --trust-builder
          e=$(date +%s.%N)
          echo "seconds=$(awk -v s=$s -v e=$e 'BEGIN{printf "%.2f", e-s}')" >> "$GITHUB_OUTPUT"

      - name: "buildkit: cold"
        id: buildkit_cold
        env:
          IMG: ${{ secrets.DOCKERHUB_ORG }}/cmp-buildkit-${{ matrix.id }}-${{ github.run_id }}:latest
        run: |
          s=$(date +%s.%N)
          "${GITHUB_WORKSPACE}/pack-bin" build "$IMG" \
            --path "${GITHUB_WORKSPACE}/samples/${{ matrix.app }}" \
            --builder "$BUILDER" --run-image "$RUN_IMAGE" \
            --platform "$PLATFORM" --build-backend buildkit \
            --buildkit-builder pack-multiplatform --publish --trust-builder
          e=$(date +%s.%N)
          echo "seconds=$(awk -v s=$s -v e=$e 'BEGIN{printf "%.2f", e-s}')" >> "$GITHUB_OUTPUT"

      - name: "buildkit: rebuild"
        id: buildkit_rebuild
        env:
          IMG: ${{ secrets.DOCKERHUB_ORG }}/cmp-buildkit-${{ matrix.id }}-${{ github.run_id }}:latest
        run: |
          s=$(date +%s.%N)
          "${GITHUB_WORKSPACE}/pack-bin" build "$IMG" \
            --path "${GITHUB_WORKSPACE}/samples/${{ matrix.app }}" \
            --builder "$BUILDER" --run-image "$RUN_IMAGE" \
            --platform "$PLATFORM" --build-backend buildkit \
            --buildkit-builder pack-multiplatform --publish --trust-builder
          e=$(date +%s.%N)
          echo "seconds=$(awk -v s=$s -v e=$e 'BEGIN{printf "%.2f", e-s}')" >> "$GITHUB_OUTPUT"

      - name: Write per-app result row
        if: ${{ always() }}
        run: |
          mkdir -p rows
          dc='${{ steps.daemon_cold.outputs.seconds }}'
          dr='${{ steps.daemon_rebuild.outputs.seconds }}'
          bc='${{ steps.buildkit_cold.outputs.seconds }}'
          br='${{ steps.buildkit_rebuild.outputs.seconds }}'
          # CSV row: app,daemon_cold,daemon_rebuild,buildkit_cold,buildkit_rebuild
          echo "${{ matrix.app }},${dc:-},${dr:-},${bc:-},${br:-}" > "rows/${{ matrix.id }}.csv"
          cat "rows/${{ matrix.id }}.csv"

      - name: Upload row
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compare-row-${{ matrix.id }}
          path: rows/${{ matrix.id }}.csv

  aggregate:
    needs: compare
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all rows
        uses: actions/download-artifact@v4
        with:
          pattern: compare-row-*
          path: rows
          merge-multiple: true

      - name: Assemble + print the comparison table (raw markdown)
        run: |
          {
            echo "# Single-arch backend comparison — docker-daemon vs buildkit"
            echo
            echo "Platform: \`${PLATFORM}\` (native). Builder: \`${BUILDER}\`. Run image: \`${RUN_IMAGE}\`."
            echo "Durations are wall-clock seconds. Δ = buildkit ÷ daemon (< 1.00x = buildkit faster)."
            echo
            echo "| App | daemon cold | daemon rebuild | buildkit cold | buildkit rebuild | cold Δ | rebuild Δ |"
            echo "|-----|------------:|---------------:|--------------:|-----------------:|-------:|----------:|"
            for f in $(find rows -name '*.csv' | sort); do
              IFS=, read -r app dc dr bc br < "$f"
              cold_d=$(awk -v a="$bc" -v b="$dc" 'BEGIN{ if(b>0) printf "%.2fx", a/b; else printf "n/a" }')
              reb_d=$(awk -v a="$br" -v b="$dr" 'BEGIN{ if(b>0) printf "%.2fx", a/b; else printf "n/a" }')
              echo "| \`$app\` | ${dc:-—} | ${dr:-—} | ${bc:-—} | ${br:-—} | ${cold_d} | ${reb_d} |"
            done
          } | tee table.md
          echo
          echo "===== RAW MARKDOWN (copy below) ====="
          cat table.md
          # Also surface it in the run summary.
          cat table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined table
        uses: actions/upload-artifact@v4
        with:
          name: compare-backends-table
          path: table.md
