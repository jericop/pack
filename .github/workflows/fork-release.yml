# Fork-only release pipeline (jericop/pack).
#
# A slim, Linux-only alternative to the upstream `build.yml` for cutting
# experimental fork releases without spending macOS/Windows runner minutes.
#
# TAG-DRIVEN: push an annotated tag `v<version>` (e.g. v0.0.1-buildkit-poc) and
# this workflow runs the unit tests, builds the linux/amd64 + linux/arm64 pack
# binaries, and creates a DRAFT GitHub Release AT THAT TAG with the .tgz
# artifacts attached. Because the tag already exists (you pushed it), the
# release tag, the git tag, and the Docker image tag all line up:
#
#     git tag                v0.0.1-buildkit-poc
#     GitHub release tag     v0.0.1-buildkit-poc
#     docker image tag       docker.io/${DOCKERHUB_ORG}/pack:0.0.1-buildkit-poc
#
# Publishing the release and pushing the Docker image are two separate MANUAL
# steps (see .kiro/steering/fork-release-process.md):
#   1. Publish the draft release in the GitHub UI (makes it + artifacts public).
#   2. Run `delivery-docker.yml` manually (workflow_dispatch, tag_name=v<version>)
#      to build + push the multi-arch image. The git tag already exists, so its
#      "checkout at tag" step resolves correctly.
#
# The unit job runs the fork-touched packages only (internal/build/multiplatform,
# internal/commands, pkg/client) on Linux — not the full upstream `go test ./...` —
# so the release gate covers this fork's BuildKit multi-arch code without dragging
# in unrelated OS-flavored upstream tests (e.g. pkg/buildpack's Windows layer test).
# Target platforms are linux/amd64 + linux/arm64 only. The BuildKit/registry
# integration tests are gated behind PACK_TEST_* env vars (not set here) so they
# SKIP; run those via the separate `fork-integration.yml` workflow.
name: fork-release

on:
  push:
    tags:
      - 'v*'
      # Feature-line tags publish an image whose tag matches the git tag verbatim,
      # e.g. buildkit-native-export-v0.1.0 -> docker.io/jericop/pack:buildkit-native-export-v0.1.0.
      # This keeps pack, lifecycle, and the builder on the same tag string.
      - 'buildkit-native-export-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version WITHOUT leading v, e.g. 0.0.1-buildkit-poc. NOTE: workflow_dispatch does not create the git tag; prefer pushing a v<version> tag so delivery-docker can check it out.'
        required: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version-file: 'go.mod'
      - name: Set up go env
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        shell: bash
      - name: Unit tests (fork-touched packages, Linux)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Scope the release gate to the packages this fork actually changes for the
        # BuildKit multi-arch work, on Linux. This avoids the full upstream suite
        # (which includes OS-flavored tests like pkg/buildpack's Windows layer test
        # that are unrelated to the fork and can flake on the Linux runner). Target
        # platforms are linux/amd64 + linux/arm64 only — no Windows/macOS.
        run: |
          go test -count=1 \
            ./internal/build/multiplatform/... \
            ./internal/commands/... \
            ./pkg/client/...

  release:
    needs: unit
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN needs explicit write access to create the release.
    # Its default scopes are often read-only (esp. on forks), which causes
    # "403 Resource not accessible by integration". contents: write is enough.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version-file: 'go.mod'
      - name: Derive pack version
        shell: bash
        run: |
          # PACK_VERSION  = version stamped into the binary + used in artifact names.
          # RELEASE_TAG   = the git/GitHub release tag (== the pushed tag verbatim,
          #                 or v<PACK_VERSION> for the classic v* / workflow_dispatch path).
          version=""
          release_tag=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            # workflow_dispatch: version supplied without leading v.
            version="${{ github.event.inputs.version }}"
            release_tag="v${version}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/(buildkit-native-export-v.*)$ ]]; then
            # Feature-line tag: the image/release tag matches the git tag verbatim
            # (no leading-v gymnastics), so pack lines up with lifecycle + builder.
            version="${BASH_REMATCH[1]}"
            release_tag="${version}"
          elif [[ "$GITHUB_REF" =~ ^refs/tags/v(.*)$ ]]; then
            # Classic tag push: strip refs/tags/v prefix.
            version="${BASH_REMATCH[1]}"
            release_tag="v${version}"
          fi
          if [[ -z "${version}" ]]; then
            echo "ERROR: pack version not detected (expected a v<version> or buildkit-native-export-v<version> tag push, or a workflow_dispatch version input)."
            exit 1
          fi
          echo "PACK_VERSION=${version}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${release_tag}" >> $GITHUB_ENV
          echo "Derived PACK_VERSION=${version} RELEASE_TAG=${release_tag}"
      - name: Build linux binaries (amd64, arm64)
        env:
          PACK_BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "=====> Building linux/${arch}"
            env PACK_VERSION="${PACK_VERSION}" GOOS=linux GOARCH="${arch}" make build
            mkdir -p "dist/linux-${arch}"
            mv out/pack "dist/linux-${arch}/pack"
          done
      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Artifact names use RELEASE_TAG so they match the release/git tag exactly
          # (v<version> for the classic path, buildkit-native-export-v<version> for
          # the feature-line path) instead of hard-coding a leading v.
          package() {
            local arch="$1" label="$2"
            chmod +x "dist/linux-${arch}/pack"
            local filename="pack-${RELEASE_TAG}-${label}.tgz"
            tar -C "dist/linux-${arch}" -vzcf "${filename}" pack
            shasum -a 256 "${filename}" > "${filename}.sha256"
          }
          package amd64 linux
          package arm64 linux-arm64
          ls -la pack-${RELEASE_TAG}-*
      - name: Extract pack help
        id: pack_help
        run: |
          chmod +x dist/linux-amd64/pack
          DELIMITER="$(uuidgen)"
          echo "help<<${DELIMITER}" >> $GITHUB_OUTPUT
          ./dist/linux-amd64/pack --help >> $GITHUB_OUTPUT || true
          echo "${DELIMITER}" >> $GITHUB_OUTPUT
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # RELEASE_TAG == the pushed git tag verbatim (v<version> classic path,
          # or buildkit-native-export-v<version> feature-line path), so the git
          # tag, the GitHub release tag, the artifacts, and the docker tag all
          # line up.
          tag_name: ${{ env.RELEASE_TAG }}
          name: pack ${{ env.RELEASE_TAG }}
          draft: true
          # Not a prerelease: keeps the release tag == git tag == docker tag and
          # avoids the prerelease/`released`-event confusion. It stays a DRAFT
          # until you publish it manually.
          prerelease: false
          files: pack-${{ env.RELEASE_TAG }}-*
          body: |
            ## Experimental fork build (jericop/pack)

            This is an experimental build of `pack` from the `jericop/pack` fork
            containing the BuildKit multi-arch work. It is NOT an official Cloud
            Native Buildpacks release.

            Linux binaries only (amd64, arm64). The multi-arch Docker image
            `docker.io/jericop/pack:${{ env.RELEASE_TAG }}` (org configurable via
            the `DOCKERHUB_ORG` repo variable) is published separately by running
            the `delivery / docker` workflow with `tag_name: ${{ env.RELEASE_TAG }}`.

            ### Install (Linux)

            ```bash
            # amd64
            (curl -sSL "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/pack-${{ env.RELEASE_TAG }}-linux.tgz" | sudo tar -C /usr/local/bin/ --no-same-owner -xzv pack)
            # arm64
            (curl -sSL "https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/pack-${{ env.RELEASE_TAG }}-linux-arm64.tgz" | sudo tar -C /usr/local/bin/ --no-same-owner -xzv pack)
            ```

            ### `pack --help`

            ```text
            ${{ steps.pack_help.outputs.help }}
            ```
