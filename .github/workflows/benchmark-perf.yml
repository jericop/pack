name: benchmark (perf matrix)

# Accurate, ISOLATED build-performance benchmark. Every measurement runs on its own
# clean runner so there is never residual cache from another app or build type — a
# genuinely cold cold-build every time.
#
# Matrix = app  ×  build-type, where build-type is one of:
#   * docker-daemon-single : standard pack build (docker-daemon backend), single
#                            host-native platform, built to the local daemon.
#   * buildkit-single      : native buildkit backend, single host-native platform,
#                            published.
#   * buildkit-multi       : native buildkit backend, multi-arch
#                            (linux/amd64 + linux/arm64), published.
# (docker-daemon has no multi-arch cell — it cannot produce a manifest list.)
#
# Each cell times its builds as SEPARATE steps (cold, rebuild, and — for buildkit —
# rebase) so durations show directly in the Actions UI. Jobs are named
# "<app> / <build-type>" so GitHub groups each app's cells together. An aggregation
# job collects the per-cell rows and prints the combined table as RAW MARKDOWN.
#
# This REPLACES the older sequential benchmark workflow (buildkit-native-benchmark.yml,
# now deprecated). The sequential scripts (benchmarks/benchmark.sh,
# benchmarks/compare-backends.sh) are kept for local smoke testing but are not used
# for accurate perf numbers.

on:
  # Runs on every push to the feature branch so we always have fresh, isolated
  # numbers for whatever was just pushed. Scoped to code/workflow/benchmark paths so
  # doc-only pushes don't spend ~20+ min of runner time on a full 15-cell matrix.
  push:
    branches:
      - buildkit-native-export
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/benchmark-perf.yml'
      - 'internal/build/multiplatform/benchmarks/**'
  workflow_dispatch:
    inputs:
      pack_image:
        description: >-
          Optional: pull `pack` from this image and copy the binary out instead of
          building from source (e.g. jericop/pack:buildkit-native-export-v0.1.0).
        required: false
        default: ""
      pack_ref:
        description: "pack fork git ref to build from when pack_image is empty"
        required: false
        default: "buildkit-native-export"
      builder:
        description: "Builder image used for all build types"
        required: false
        default: "jericop/ubuntu-noble-builder:buildkit-native-export"
      run_image:
        description: "Run image"
        required: false
        default: "paketobuildpacks/ubuntu-noble-run:latest"
      samples_repo:
        description: "Samples repo to checkout (org/name)"
        required: false
        default: "buildpacks/samples"

env:
  PACK_IMAGE: ${{ github.event.inputs.pack_image || '' }}
  PACK_REF: ${{ github.event.inputs.pack_ref || 'buildkit-native-export' }}
  BUILDER: ${{ github.event.inputs.builder || 'jericop/ubuntu-noble-builder:buildkit-native-export' }}
  RUN_IMAGE: ${{ github.event.inputs.run_image || 'paketobuildpacks/ubuntu-noble-run:latest' }}
  SAMPLES_REPO: ${{ github.event.inputs.samples_repo || 'buildpacks/samples' }}
  HOST_PLATFORM: linux/amd64          # CI runners are amd64
  MULTI_PLATFORMS: linux/amd64,linux/arm64

jobs:
  bench:
    name: "${{ matrix.id }} / ${{ matrix.build_type }}"
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: go/mod,         id: go-mod }
          - { name: nodejs/npm,     id: nodejs-npm }
          - { name: java/maven,     id: java-maven }
          - { name: java/java-node, id: java-java-node }
          - { name: python/poetry,  id: python-poetry }
        build_type: [docker-daemon-single, buildkit-single, buildkit-multi]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout samples
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SAMPLES_REPO }}
          path: samples

      - name: Checkout pack source
        if: ${{ env.PACK_IMAGE == '' }}
        uses: actions/checkout@v5
        with:
          repository: jericop/pack
          # On push, build the EXACT pushed commit (github.sha) so the benchmark
          # measures what was just pushed. On workflow_dispatch, use pack_ref.
          ref: ${{ github.event_name == 'push' && github.sha || env.PACK_REF }}
          path: pack-src

      - name: Set up Go
        if: ${{ env.PACK_IMAGE == '' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: pack-src/go.mod

      - name: Build pack from source
        if: ${{ env.PACK_IMAGE == '' }}
        run: |
          cd pack-src
          go build -o "${GITHUB_WORKSPACE}/pack-bin" .

      - name: Copy pack binary out of published image
        if: ${{ env.PACK_IMAGE != '' }}
        run: |
          docker pull "${PACK_IMAGE}"
          cid="$(docker create "${PACK_IMAGE}")"
          docker cp "${cid}:/usr/local/bin/pack" "${GITHUB_WORKSPACE}/pack-bin"
          docker rm "${cid}" >/dev/null

      - name: pack version + experimental
        run: |
          chmod +x "${GITHUB_WORKSPACE}/pack-bin"
          "${GITHUB_WORKSPACE}/pack-bin" version
          "${GITHUB_WORKSPACE}/pack-bin" config experimental true

      - name: Set up Docker Buildx
        if: ${{ matrix.build_type != 'docker-daemon-single' }}
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (multi-arch only)
        if: ${{ matrix.build_type == 'buildkit-multi' }}
        uses: docker/setup-qemu-action@v3

      - name: Create buildx builder
        if: ${{ matrix.build_type != 'docker-daemon-single' }}
        run: docker buildx create --name pack-multiplatform --driver docker-container --bootstrap --use

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Warm up the builder + run images so image pull time is excluded from the
      # timed builds below. Daemon: docker pull. Buildkit: a cache-only 2-FROM solve
      # for the platform(s) this cell builds.
      - name: Warm up images (excluded from timings)
        run: |
          if [ "${{ matrix.build_type }}" = "buildkit-multi" ]; then PLATS="$MULTI_PLATFORMS"; else PLATS="$HOST_PLATFORM"; fi
          # daemon store (host arch is enough for the daemon-single cell)
          docker pull --platform "$HOST_PLATFORM" "$BUILDER" || true
          docker pull --platform "$HOST_PLATFORM" "$RUN_IMAGE" || true
          if [ "${{ matrix.build_type }}" != "docker-daemon-single" ]; then
            seed="$(mktemp -d)"
            printf 'FROM %s AS b\nFROM %s AS r\n' "$BUILDER" "$RUN_IMAGE" > "$seed/Dockerfile"
            docker buildx build --builder pack-multiplatform --platform "$PLATS" --output=type=cacheonly "$seed"
            rm -rf "$seed"
          fi

      # Resolve this cell's pack invocation into reusable env for the timed steps.
      - name: Resolve build command
        id: cmd
        run: |
          app_path="${GITHUB_WORKSPACE}/samples/${{ matrix.app.name }}"
          case "${{ matrix.build_type }}" in
            docker-daemon-single)
              img="cmp-${{ matrix.id }}-${{ github.run_id }}:latest"
              common="--path $app_path --builder $BUILDER --run-image $RUN_IMAGE --platform $HOST_PLATFORM --trust-builder"
              ;;
            buildkit-single)
              img="${{ secrets.DOCKERHUB_ORG }}/bench-bk-single-${{ matrix.id }}-${{ github.run_id }}:latest"
              common="--path $app_path --builder $BUILDER --run-image $RUN_IMAGE --platform $HOST_PLATFORM --build-backend buildkit --buildkit-builder pack-multiplatform --publish --trust-builder"
              ;;
            buildkit-multi)
              img="${{ secrets.DOCKERHUB_ORG }}/bench-bk-multi-${{ matrix.id }}-${{ github.run_id }}:latest"
              plat_args="--platform linux/amd64 --platform linux/arm64"
              common="--path $app_path --builder $BUILDER --run-image $RUN_IMAGE $plat_args --build-backend buildkit --buildkit-builder pack-multiplatform --publish --trust-builder"
              ;;
          esac
          echo "img=$img" >> "$GITHUB_OUTPUT"
          echo "common=$common" >> "$GITHUB_OUTPUT"

      - name: "cold build"
        id: cold
        run: |
          s=$(date +%s.%N)
          "${GITHUB_WORKSPACE}/pack-bin" build "${{ steps.cmd.outputs.img }}" ${{ steps.cmd.outputs.common }}
          e=$(date +%s.%N)
          echo "seconds=$(awk -v s=$s -v e=$e 'BEGIN{printf "%.2f", e-s}')" >> "$GITHUB_OUTPUT"

      - name: "rebuild (warm)"
        id: rebuild
        run: |
          s=$(date +%s.%N)
          "${GITHUB_WORKSPACE}/pack-bin" build "${{ steps.cmd.outputs.img }}" ${{ steps.cmd.outputs.common }}
          e=$(date +%s.%N)
          echo "seconds=$(awk -v s=$s -v e=$e 'BEGIN{printf "%.2f", e-s}')" >> "$GITHUB_OUTPUT"

      # Rebase only applies to the published buildkit images.
      - name: "rebase"
        id: rebase
        if: ${{ matrix.build_type != 'docker-daemon-single' }}
        run: |
          s=$(date +%s.%N)
          "${GITHUB_WORKSPACE}/pack-bin" rebase "${{ steps.cmd.outputs.img }}" \
            --run-image "$RUN_IMAGE" --publish
          e=$(date +%s.%N)
          echo "seconds=$(awk -v s=$s -v e=$e 'BEGIN{printf "%.2f", e-s}')" >> "$GITHUB_OUTPUT"

      - name: Write per-cell result row
        if: ${{ always() }}
        run: |
          mkdir -p rows
          # CSV: app,build_type,cold,rebuild,rebase
          echo "${{ matrix.app.name }},${{ matrix.build_type }},${{ steps.cold.outputs.seconds }},${{ steps.rebuild.outputs.seconds }},${{ steps.rebase.outputs.seconds }}" > "rows/${{ matrix.id }}-${{ matrix.build_type }}.csv"
          cat "rows/${{ matrix.id }}-${{ matrix.build_type }}.csv"

      - name: Upload row
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-row-${{ matrix.id }}-${{ matrix.build_type }}
          path: rows/${{ matrix.id }}-${{ matrix.build_type }}.csv

  aggregate:
    needs: bench
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all rows
        uses: actions/download-artifact@v4
        with:
          pattern: bench-row-*
          path: rows
          merge-multiple: true

      - name: Assemble + print the benchmark table (raw markdown)
        run: |
          {
            echo "# Build performance — isolated per-runner benchmark"
            echo
            echo "Each cell built on its own clean runner (cold cache). Builder: \`${BUILDER}\`."
            echo "Run image: \`${RUN_IMAGE}\`. single = host-native (\`${HOST_PLATFORM}\`); multi = \`${MULTI_PLATFORMS}\`."
            echo "Durations are wall-clock seconds; rebase is n/a for docker-daemon."
            echo
            echo "| App | Build type | Cold (s) | Rebuild (s) | Rebase (s) |"
            echo "|-----|------------|---------:|------------:|-----------:|"
            for f in $(find rows -name '*.csv' | sort); do
              IFS=, read -r app bt cold rebuild rebase < "$f"
              echo "| \`$app\` | $bt | ${cold:-—} | ${rebuild:-—} | ${rebase:-—} |"
            done
          } | tee table.md
          echo
          echo "===== RAW MARKDOWN (copy below) ====="
          cat table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined table
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-perf-table
          path: table.md
