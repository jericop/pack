name: buildkit-native benchmark

# Runs the fork's BuildKit-native (Option A) benchmark harness against a matrix of
# buildpacks sample apps and uploads the resulting duration/cache table (Markdown +
# CSV) and per-step logs as an artifact for later review.
#
# Manual only (workflow_dispatch): it drives real multi-arch builds and is not
# meant to run on every push. Reproduce a run by re-dispatching with the same
# inputs.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Space-separated "lang/app" list to benchmark'
        required: false
        default: 'python/poetry nodejs/npm java/maven java/java-node go/mod'
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64,linux/arm64'
      builder:
        description: 'Builder image (bundles the lifecycle)'
        required: false
        default: 'jericop/ubuntu-noble-builder:buildkit-multi-arch-poc'
      lifecycle_image:
        description: 'Override lifecycle image (blank = builder default)'
        required: false
        default: ''
      run_image:
        description: 'Run image'
        required: false
        default: 'paketobuildpacks/ubuntu-noble-run:latest'
      do_rebase:
        description: 'Run the rebase step (true/false)'
        required: false
        default: 'true'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pack (this fork)
        uses: actions/checkout@v5

      - name: Checkout buildpacks/samples
        uses: actions/checkout@v5
        with:
          repository: buildpacks/samples
          path: samples

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build pack from source
        run: |
          go build -o ./pack-bin .
          ./pack-bin version
          ./pack-bin config experimental true

      - name: Install crane (for layer counts)
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # A docker-container buildx builder cannot reach a registry published on the
      # host's localhost. We run registry:2 on a user-defined docker network and
      # reference it BY CONTAINER NAME from BuildKit (REGISTRY_PUSH), while the host
      # (finalize + rebase + crane) reaches it via the published localhost port
      # (REGISTRY_HOST). The harness bridges the two names via PACK_HOST_REGISTRY_REMAP.
      - name: Start local registry on a shared docker network
        run: |
          docker network create pack-bench-net
          docker run -d --restart always --name pack-bench-registry \
            --network pack-bench-net -p 5050:5000 registry:2
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:5050/v2/; then echo "registry up"; break; fi
            sleep 1
          done

      - name: Set up Docker Buildx (reachable from the registry network)
        uses: docker/setup-buildx-action@v3

      - name: Create buildx builder on the registry network
        run: |
          docker buildx create --name pack-multiplatform \
            --driver docker-container \
            --driver-opt network=pack-bench-net \
            --buildkitd-flags '--allow-insecure-entitlement network.host' \
            --bootstrap --use
          docker buildx ls

      - name: Run benchmark harness
        env:
          PACK_BIN: ./pack-bin
          SAMPLES_DIR: ./samples
          BENCH_APPS: ${{ github.event.inputs.apps }}
          PLATFORMS: ${{ github.event.inputs.platforms }}
          BUILDER: ${{ github.event.inputs.builder }}
          LIFECYCLE_IMAGE: ${{ github.event.inputs.lifecycle_image }}
          RUN_IMAGE: ${{ github.event.inputs.run_image }}
          DO_REBASE: ${{ github.event.inputs.do_rebase }}
          BUILDKIT_BUILDER: pack-multiplatform
          # BuildKit pushes by container name; host tools reach it via localhost.
          REGISTRY_PUSH: pack-bench-registry:5000
          REGISTRY_HOST: localhost:5050
          OUT_DIR: ./benchmark-out
        run: |
          chmod +x internal/build/multiplatform/benchmarks/benchmark.sh
          # Do not fail the job on a single app build failure — the table records
          # per-app results and we always want the artifact uploaded.
          internal/build/multiplatform/benchmarks/benchmark.sh || echo "harness exited non-zero (see table for per-app results)"

      - name: Summarize table in job summary
        if: always()
        run: |
          latest_md="$(ls -1t benchmark-out/benchmark-table-*.md 2>/dev/null | head -1 || true)"
          if [ -n "$latest_md" ]; then
            cat "$latest_md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark table was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifact (table + CSV + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildkit-native-benchmark
          path: benchmark-out/
          if-no-files-found: warn

      - name: Tear down registry + network
        if: always()
        run: |
          docker rm -f pack-bench-registry || true
          docker network rm pack-bench-net || true
